services:
  - type: web
    name: matchwear-fc
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: CATALOG_URL
        sync: false
      - key: ADMIN_API_URL
        sync: false
  - type: worker
    name: matchwear-fc-sync
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SYNC_INTERVAL_MINUTES
        value: 60
      - key: STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: SITE_URL
        sync: false
  - type: web
    name: matchwear-fc-admin-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm run admin:server
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_ALLOWED_ORIGIN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: SITE_URL
        sync: false
