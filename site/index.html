<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000D48" />
    <meta
      name="description"
      content="Camisas de futebol selecionadas pela Matchwear FC. Peça pelo WhatsApp."
    />
    <link rel="icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Matchwear FC — Vista sua paixão</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Matchwear FC — início"
        ><img
          src="assets/matchwear-logo-green-on-blue.png"
          alt="Matchwear — Vista sua paixão"
      /></a>
      <nav class="shop-nav" aria-label="Navegação da loja">
        <a class="header-link" href="#catalogo">Catálogo</a>
        <button
          id="favoritesButton"
          class="nav-action"
          type="button"
          aria-label="Mostrar favoritos"
        >
          ♡ <span id="favoritesCount">0</span>
        </button>
        <button
          id="cartButton"
          class="nav-action"
          type="button"
          aria-label="Abrir sacola"
        >
          Sacola <span id="cartCount">0</span>
        </button>
        <a class="admin-entry" href="admin/" aria-label="Painel administrativo"
          >Admin</a
        >
      </nav>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-stripe" aria-hidden="true"></div>
        <div class="hero-copy">
          <p class="eyebrow">MATCHWEAR FC</p>
          <h1 id="hero-title">
            <span>VISTA SUA</span>
            <span>PAIXÃO</span>
          </h1>
          <a href="#catalogo" class="button button-primary">Ver catálogo</a>
        </div>
        <div class="hero-product" aria-label="Logo Matchwear FC em 3D">
          <span class="hero-number" aria-hidden="true">12</span>
          <div class="logo-stage">
            <div class="logo-stage-orbit" aria-hidden="true"></div>
            <div id="logoScene" class="logo-scene">
              <img
                class="logo-scene-fallback"
                src="assets/matchwear-logo-green-on-blue.png"
                alt="Matchwear — Vista sua paixão"
              />
            </div>
            <p class="logo-stage-hint"><span></span> Arraste para girar</p>
          </div>
        </div>
      </section>
      <section id="catalogo" class="catalog">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ESCOLHA O SEU MANTO</p>
            <h2>CATÁLOGO</h2>
          </div>
          <p id="count">Carregando...</p>
        </div>
        <div class="tools" aria-label="Filtros do catálogo">
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><span class="sr-only">Buscar produto</span
            ><input
              id="search"
              type="search"
              placeholder="Buscar time ou camisa..."
              autocomplete="off"
          /></label>
          <select id="category" aria-label="Filtrar por categoria">
            <option value="">Todas as categorias</option>
          </select>
          <select id="size" aria-label="Filtrar por tamanho">
            <option value="">Todos os tamanhos</option>
          </select>
          <select id="sort" aria-label="Ordenar produtos">
            <option value="default">Recomendados</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
            <option value="name">Nome A–Z</option>
          </select>
        </div>
        <div
          id="categoryChips"
          class="category-chips"
          aria-label="Navegar por categorias"
        ></div>
        <div id="favoritesMode" class="favorites-mode" hidden>
          <span>Mostrando somente seus favoritos</span
          ><button id="clearFavoritesMode" type="button">Ver todos</button>
        </div>
        <div id="status" class="status" hidden></div>
        <div id="grid" class="grid" aria-live="polite"></div>
        <aside class="campaign" aria-label="Campanha Matchwear FC">
          <img
            src="assets/matchwear-logo-blue-on-green.png"
            alt="Matchwear — Vista sua paixão"
          />
          <div>
            <p class="eyebrow">CAMPANHA MATCHWEAR</p>
            <h2>O JOGO COMEÇA NO MANTO.</h2>
          </div>
        </aside>
      </section>
    </main>
    <footer class="site-footer">
      <img
        src="assets/matchwear-logo-green-on-blue.png"
        alt="Matchwear — Vista sua paixão"
      />
      <p>Vista o jogo. Viva a paixão.</p>
      <p class="sync" id="sync"></p>
    </footer>
    <dialog id="productDialog" aria-labelledby="dialogTitle">
      <button class="close" aria-label="Fechar produto">×</button>
      <div id="dialogContent"></div>
    </dialog>
    <dialog id="cartDialog" class="cart-dialog" aria-labelledby="cartTitle">
      <button id="closeCart" class="close" aria-label="Fechar sacola">×</button>
      <div class="cart-panel">
        <p class="eyebrow">SEU PEDIDO</p>
        <h2 id="cartTitle">SACOLA</h2>
        <div id="cartItems"></div>
        <div id="cartSummary" class="cart-summary"></div>
      </div>
    </dialog>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module" src="hero-3d.js"></script>
  </body>
</html>
